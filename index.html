<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Biyo-Metrik Nabız & Beyin Analizi</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: #1e2130;
            --text-main: #f1f2f6;
            --text-muted: #a4b0be;
            --accent-red: #ff4757;
            --accent-blue: #1e90ff;
            --accent-green: #2ed573;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0 0 5px 0;
            text-align: center;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 420px;
        }

        .card {
            background-color: var(--panel-bg);
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            text-align: center;
        }

        .bpm-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }

        #bpm-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 5px solid var(--accent-red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.3);
            transition: transform 0.1s ease-out;
        }

        /* PPG / Beyin Grafiği Canvas */
        #graphCanvas {
            width: 100%;
            height: 80px;
            background-color: #12141d;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .info-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
            text-align: left;
        }

        .info-title.brain { color: var(--accent-blue); }
        .info-title.music { color: var(--accent-green); }

        .desc {
            font-size: 0.9rem;
            line-height: 1.4;
            color: #dfe4ea;
            text-align: left;
        }

        #status {
            font-size: 0.9rem;
            color: #ced6e0;
            min-height: 20px;
            margin: 5px 0;
        }

        button {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }

        button:active { background-color: #ff6b81; }

        #videoElement, #procCanvas { display: none; }
    </style>
</head>
<body>

    <h1>Biyo-Metrik Analiz</h1>
    <div class="subtitle">PPG Sinyal Dalgası & Bilişsel Durum Tahmini</div>

    <div class="dashboard">
        
        <!-- Kalp Atışı & Canlı Grafik Kartı -->
        <div class="card">
            <div id="status">Sistemi başlatmak için butonuna dokunun</div>
            <div class="bpm-container">
                <div id="bpm-circle">--</div>
            </div>
            
            <!-- Canlı PPG Grafiği -->
            <canvas id="graphCanvas" width="380" height="80"></canvas>
            
            <button id="startBtn">Ölçümü Başlat</button>
        </div>

        <!-- Beyin Analizi Kartı -->
        <div class="card">
            <div class="info-title brain">Bilişsel Zihin Durumu</div>
            <div id="brain-desc" class="desc">
                <em>Nabız verisi bekleniyor...</em>
            </div>
        </div>

        <!-- Müzik Önerisi Kartı -->
        <div class="card">
            <div class="info-title music">Müzik & Frekans Reçetesi</div>
            <div id="music-desc" class="desc">
                <em>Analiz bekleniyor...</em>
            </div>
        </div>

    </div>

    <!-- İşleme için gizli video ve canvas -->
    <video id="videoElement" autoplay playsinline></video>
    <canvas id="procCanvas" width="40" height="40"></canvas>

    <script>
        const video = document.getElementById('videoElement');
        const procCanvas = document.getElementById('procCanvas');
        const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });
        
        const graphCanvas = document.getElementById('graphCanvas');
        const graphCtx = graphCanvas.getContext('2d');

        const bpmDisplay = document.getElementById('bpm-circle');
        const statusText = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const brainDesc = document.getElementById('brain-desc');
        const musicDesc = document.getElementById('music-desc');

        let isRunning = false;
        let animationId;
        
        const redHistory = [];
        const MAX_GRAPH_POINTS = 100;
        let lastBeatTime = 0;
        let beatIntervals = [];

        // Flaş ve Ana Arka Kamerayı Zorlama Algoritması
        async function getBestBackCamera() {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(device => device.kind === 'videoinput');

            // "back", "rear", "environment" kelimeleri içeren kamera veya en sonuncu kamerayı seç
            let targetDevice = videoDevices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('rear'));
            
            if (!targetDevice && videoDevices.length > 0) {
                targetDevice = videoDevices[videoDevices.length - 1]; // Genelde ana kamera dizinin sonundadır
            }

            const constraints = {
                video: {
                    deviceId: targetDevice ? { exact: targetDevice.deviceId } : undefined,
                    facingMode: targetDevice ? undefined : "environment",
                    width: { ideal: 320 },
                    height: { ideal: 240 },
                    frameRate: { ideal: 30 }
                }
            };

            return await navigator.mediaDevices.getUserMedia(constraints);
        }

        startBtn.addEventListener('click', async () => {
            if (isRunning) {
                stopMonitor();
                return;
            }

            try {
                const stream = await getBestBackCamera();
                video.srcObject = stream;

                // Flaş Desteğini (Torch) Açmayı Dene
                const track = stream.getVideoTracks()[0];
                try {
                    await track.applyConstraints({
                        advanced: [{ torch: true }]
                    });
                } catch (e) {
                    console.log("Flaş donanımsal olarak açılamadı veya desteklenmiyor:", e);
                }

                video.onloadedmetadata = () => {
                    video.play();
                    isRunning = true;
                    startBtn.innerText = "Ölçümü Durdur";
                    startBtn.style.backgroundColor = "#747d8c";
                    statusText.innerText = "Parmağınızı FLAŞIN ve KAMERANIN üstüne kapatın...";
                    processFrame();
                };
            } catch (err) {
                statusText.innerText = "Kamera erişim hatası! Lütfen izinleri kontrol edin.";
                console.error(err);
            }
        });

        function stopMonitor() {
            isRunning = false;
            startBtn.innerText = "Ölçümü Başlat";
            startBtn.style.backgroundColor = "var(--accent-red)";
            statusText.innerText = "Durduruldu.";
            bpmDisplay.innerText = "--";
            brainDesc.innerHTML = "<em>Nabız verisi bekleniyor...</em>";
            musicDesc.innerHTML = "<em>Analiz bekleniyor...</em>";
            
            cancelAnimationFrame(animationId);
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            redHistory.length = 0;
            beatIntervals.length = 0;
            clearGraph();
        }

        function processFrame() {
            if (!isRunning) return;

            procCtx.drawImage(video, 0, 0, procCanvas.width, procCanvas.height);
            const frame = procCtx.getImageData(0, 0, procCanvas.width, procCanvas.height);
            
            let redSum = 0, greenSum = 0;

            for (let i = 0; i < frame.data.length; i += 4) {
                redSum += frame.data[i];
                greenSum += frame.data[i+1];
            }

            const pixelCount = frame.data.length / 4;
            const redAverage = redSum / pixelCount;
            const greenAverage = greenSum / pixelCount;

            // Hassas Parmak Algılama Eşiği
            if (redAverage < 140 || (redAverage - greenAverage) < 40) {
                statusText.innerText = "Lütfen parmağınızla flaş ve kamerayı tamamen kapatın!";
                bpmDisplay.innerText = "--";
                redHistory.length = 0;
                clearGraph();
            } else {
                statusText.innerText = "Sinyal alınıyor, parmağınızı oynatmayın...";
                analyzeSignal(redAverage);
                drawGraph();
            }

            animationId = requestAnimationFrame(processFrame);
        }

        function analyzeSignal(currentRed) {
            redHistory.push(currentRed);
            if (redHistory.length > MAX_GRAPH_POINTS) redHistory.shift();
            if (redHistory.length < 30) return;

            const mean = redHistory.reduce((a, b) => a + b, 0) / redHistory.length;
            const threshold = mean * 0.996; // Dinamik dalga emilim eşiği
            const now = performance.now();

            if (currentRed < threshold) {
                const timeSinceLastBeat = now - lastBeatTime;
                
                // 350ms - 1400ms arası geçerli kalp atımı filtresi (42 - 170 BPM)
                if (timeSinceLastBeat > 350 && timeSinceLastBeat < 1400) {
                    lastBeatTime = now;
                    const currentBPM = 60000 / timeSinceLastBeat;
                    beatIntervals.push(currentBPM);
                    
                    if (beatIntervals.length > 5) beatIntervals.shift();

                    // Nabız Kalp Efekti
                    bpmDisplay.style.transform = "scale(1.1)";
                    setTimeout(() => bpmDisplay.style.transform = "scale(1)", 120);

                    const avgBPM = Math.round(beatIntervals.reduce((a, b) => a + b, 0) / beatIntervals.length);
                    bpmDisplay.innerText = avgBPM;

                    if (beatIntervals.length >= 3) {
                        updateDashboard(avgBPM);
                    }
                } else if (timeSinceLastBeat >= 1400) {
                    lastBeatTime = now;
                }
            }
        }

        // PPG Sinyal / Beyin Dalgası Çizim Fonksiyonu
        function drawGraph() {
            graphCtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
            if (redHistory.length < 2) return;

            const min = Math.min(...redHistory);
            const max = Math.max(...redHistory);
            const range = (max - min) || 1;

            graphCtx.beginPath();
            graphCtx.lineWidth = 2;
            graphCtx.strokeStyle = "#ff4757";

            const step = graphCanvas.width / (MAX_GRAPH_POINTS - 1);

            for (let i = 0; i < redHistory.length; i++) {
                // Sinyali ters çeviriyoruz (ışık emilimi tepe yapsın diye)
                const normalized = 1 - ((redHistory[i] - min) / range);
                const x = i * step;
                const y = (normalized * (graphCanvas.height - 20)) + 10;

                if (i === 0) {
                    graphCtx.moveTo(x, y);
                } else {
                    graphCtx.lineTo(x, y);
                }
            }
            graphCtx.stroke();
        }

        function clearGraph() {
            graphCtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
        }

        function updateDashboard(bpm) {
            if (bpm < 65) {
                brainDesc.innerHTML = `
                    <strong>Zihin Modu:</strong> Derin Dinlenme / Rölanti<br>
                    <strong>Baskın Dalga:</strong> Teta - Düşük Alfa (4-10 Hz)<br>
                    <strong>Metabolizma:</strong> Parasempatik sistem aktif. Vücut kendini yenileme modunda.`;
                
                musicDesc.innerHTML = `
                    <strong>Tavsiye Frekans:</strong> 432 Hz veya 528 Hz Solfeggio<br>
                    <strong>Müzik Türü:</strong> Ambient, Nature Sounds, Lo-Fi<br>
                    <strong>Amaç:</strong> Odaklanmayı bozmadan zihni sakince uyanık tutmak.`;
            } 
            else if (bpm >= 65 && bpm < 95) {
                brainDesc.innerHTML = `
                    <strong>Zihin Modu:</strong> Aktif Odak / Analitik Çalışma<br>
                    <strong>Baskın Dalga:</strong> Beta Dalgası (12-25 Hz)<br>
                    <strong>Metabolizma:</strong> İdeal bilişsel performans, problem çözme ve karar alma seviyesi.`;
                
                musicDesc.innerHTML = `
                    <strong>Tavsiye Frekans:</strong> Bireysel ritme uygun 100-120 BPM<br>
                    <strong>Müzik Türü:</strong> Deep House, Enstrümantal Synth, Chillhop<br>
                    <strong>Amaç:</strong> Akış (Flow) durumunu korumak.`;
            } 
            else {
                brainDesc.innerHTML = `
                    <strong>Zihin Modu:</strong> Yüksek Uyarılma / Stres / Efor<br>
                    <strong>Baskın Dalga:</strong> Yüksek Beta - Gama (25+ Hz)<br>
                    <strong>Metabolizma:</strong> Sempatik sistem devrede, adrenalin seviyesi yüksek.`;
                
                musicDesc.innerHTML = `
                    <strong>Sakinleşmek İçin:</strong> 60 BPM Barok Müzik, Akustik, Neo-Klasik<br>
                    <strong>Egzersiz İçin:</strong> Uptempo Synthwave, Techno, Rock (130+ BPM)<br>
                    <strong>Amaç:</strong> Nabzı aşağı çekmek veya mevcut ritme uyum sağlamak.`;
            }
        }
    </script>
</body>
</html>
