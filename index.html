<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gelişmiş PPG Biyo-Metrik Analiz</title>
    <style>
        :root {
            --bg-color: #0d0f17;
            --panel-bg: #181b29;
            --text-main: #f1f2f6;
            --text-muted: #8c98a9;
            --accent-red: #ff4757;
            --accent-blue: #1e90ff;
            --accent-green: #2ed573;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 { font-size: 1.3rem; margin: 0 0 4px 0; text-align: center; }
        .subtitle { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 15px; text-align: center; }

        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }

        .card {
            background-color: var(--panel-bg);
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            text-align: center;
        }

        .bpm-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }

        #bpm-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid var(--accent-red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.25);
            transition: transform 0.1s ease;
        }

        #graphCanvas {
            width: 100%;
            height: 75px;
            background-color: #10121d;
            border-radius: 8px;
            margin-top: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .info-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 4px;
            text-align: left;
        }
        .info-title.brain { color: var(--accent-blue); }
        .info-title.music { color: var(--accent-green); }

        .desc { font-size: 0.85rem; line-height: 1.4; color: #d1d8e0; text-align: left; }

        #status { font-size: 0.85rem; color: #a4b0be; min-height: 18px; margin: 6px 0; }

        button {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        button:active { opacity: 0.85; }
        #videoElement, #procCanvas { display: none; }
    </style>
</head>
<body>

    <h1>Biyo-Metrik Analiz</h1>
    <div class="subtitle">Dinamik Sinyal İşlemeli Kamera Ölçümü</div>

    <div class="dashboard">
        <div class="card">
            <div id="status">Ölçümü başlatmak için butona basın</div>
            <div class="bpm-container">
                <div id="bpm-circle">--</div>
            </div>
            
            <canvas id="graphCanvas" width="360" height="75"></canvas>
            
            <button id="startBtn">Ölçümü Başlat</button>
        </div>

        <div class="card">
            <div class="info-title brain">Bilişsel Zihin Analizi</div>
            <div id="brain-desc" class="desc"><em>Ölçüm bekleniyor...</em></div>
        </div>

        <div class="card">
            <div class="info-title music">Müzik Reçetesi</div>
            <div id="music-desc" class="desc"><em>Ölçüm bekleniyor...</em></div>
        </div>
    </div>

    <video id="videoElement" autoplay playsinline></video>
    <canvas id="procCanvas" width="40" height="40"></canvas>

    <script>
        const video = document.getElementById('videoElement');
        const procCanvas = document.getElementById('procCanvas');
        const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });
        
        const graphCanvas = document.getElementById('graphCanvas');
        const graphCtx = graphCanvas.getContext('2d');

        const bpmDisplay = document.getElementById('bpm-circle');
        const statusText = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const brainDesc = document.getElementById('brain-desc');
        const musicDesc = document.getElementById('music-desc');

        let isRunning = false;
        let animationId;
        
        // Sinyal dizileri
        const rawSignals = [];
        const filteredSignals = [];
        const MAX_POINTS = 120;
        
        let lastBeatTime = performance.now();
        let intervals = [];
        let bpmHistory = [];

        async function startCamera() {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(d => d.kind === 'videoinput');
            
            // Arka kamerayı hassas seç
            let backCam = videoDevices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('rear'));
            if (!backCam && videoDevices.length > 0) backCam = videoDevices[videoDevices.length - 1];

            const constraints = {
                video: {
                    deviceId: backCam ? { exact: backCam.deviceId } : undefined,
                    facingMode: backCam ? undefined : "environment",
                    width: { ideal: 320 },
                    height: { ideal: 240 }
                }
            };

            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;

            // Flaş açmayı dene
            const track = stream.getVideoTracks()[0];
            try {
                await track.applyConstraints({ advanced: [{ torch: true }] });
            } catch (e) {
                console.log("Flaş manuel tetiklenemedi veya yok:", e);
            }
        }

        startBtn.addEventListener('click', async () => {
            if (isRunning) {
                stopMonitor();
                return;
            }

            try {
                await startCamera();
                video.onloadedmetadata = () => {
                    video.play();
                    isRunning = true;
                    startBtn.innerText = "Durdur";
                    startBtn.style.backgroundColor = "#57606f";
                    statusText.innerText = "Parmağınızı KAMERA üzerine HAFİFÇE koyun...";
                    processLoop();
                };
            } catch (err) {
                statusText.innerText = "Kamera izni verilemedi.";
                console.error(err);
            }
        });

        function stopMonitor() {
            isRunning = false;
            startBtn.innerText = "Ölçümü Başlat";
            startBtn.style.backgroundColor = "var(--accent-red)";
            statusText.innerText = "Durduruldu.";
            bpmDisplay.innerText = "--";
            brainDesc.innerHTML = "<em>Ölçüm bekleniyor...</em>";
            musicDesc.innerHTML = "<em>Ölçüm bekleniyor...</em>";
            
            cancelAnimationFrame(animationId);
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
            }
            rawSignals.length = 0;
            filteredSignals.length = 0;
            intervals.length = 0;
            bpmHistory.length = 0;
            clearGraph();
        }

        function processLoop() {
            if (!isRunning) return;

            procCtx.drawImage(video, 0, 0, procCanvas.width, procCanvas.height);
            const imgData = procCtx.getImageData(0, 0, procCanvas.width, procCanvas.height);
            
            let redSum = 0, greenSum = 0, blueSum = 0;
            const pixels = imgData.data.length / 4;

            for (let i = 0; i < imgData.data.length; i += 4) {
                redSum += imgData.data[i];
                greenSum += imgData.data[i+1];
                blueSum += imgData.data[i+2];
            }

            const r = redSum / pixels;
            const g = greenSum / pixels;
            const b = blueSum / pixels;

            // YENİ PARMAK ALGILAMA: Kamera kapalı mı ve Kırmızı baskın mı? (Doygunluk toleranslı)
            const isFingerPresent = (r > 70 && r > b * 1.2) || (r > 200 && g > 100 && b < 180);

            if (!isFingerPresent) {
                statusText.innerText = "Parmağınızı kameraya tam kapatacak şekilde HAFİFÇE dokundurun.";
                bpmDisplay.innerText = "--";
                rawSignals.length = 0;
                filteredSignals.length = 0;
                clearGraph();
            } else {
                statusText.innerText = "Ölçülüyor... Parmağınızı OYNATMAYIN ve BASTIRMAYIN.";
                processPPGSignal(r);
                drawGraph();
            }

            animationId = requestAnimationFrame(processLoop);
        }

        function processPPGSignal(val) {
            rawSignals.push(val);
            if (rawSignals.length > MAX_POINTS) rawSignals.shift();

            if (rawSignals.length < 30) return; // Yeterli veri biriksin

            // Hareketli Ortalama (DC Bileşeni)
            const mean = rawSignals.reduce((a, b) => a + b, 0) / rawSignals.length;
            
            // AC Sinyali (Kan Basıncı Dalgalanması)
            const acSignal = val - mean;
            filteredSignals.push(acSignal);
            if (filteredSignals.length > MAX_POINTS) filteredSignals.shift();

            // Peak (Tepe Noktası) Tespiti
            const now = performance.now();
            const timeDiff = now - lastBeatTime;

            // En az 400ms (Max 150 BPM) ve En çok 1400ms (Min 43 BPM) sınırı
            if (acSignal < -0.8 && timeDiff > 400 && timeDiff < 1400) {
                // Sinyalin lokal dip noktası (ışık emilimi tepe noktası)
                lastBeatTime = now;
                
                const calculatedBPM = 60000 / timeDiff;
                
                if (calculatedBPM >= 45 && calculatedBPM <= 165) {
                    bpmHistory.push(calculatedBPM);
                    if (bpmHistory.length > 5) bpmHistory.shift();

                    // Efekt
                    bpmDisplay.style.transform = "scale(1.1)";
                    setTimeout(() => bpmDisplay.style.transform = "scale(1)", 100);

                    // Medyan Filtresi (Hatalı yüksek/düşük sıçramaları eler)
                    const sorted = [...bpmHistory].sort((a,b) => a - b);
                    const medianBPM = Math.round(sorted[Math.floor(sorted.length / 2)]);

                    bpmDisplay.innerText = medianBPM;
                    
                    if (bpmHistory.length >= 3) {
                        updateDashboard(medianBPM);
                    }
                }
            }
        }

        function drawGraph() {
            graphCtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
            if (filteredSignals.length < 2) return;

            const min = Math.min(...filteredSignals);
            const max = Math.max(...filteredSignals);
            const range = (max - min) || 1;

            graphCtx.beginPath();
            graphCtx.lineWidth = 2;
            graphCtx.strokeStyle = "#ff4757";

            const step = graphCanvas.width / (MAX_POINTS - 1);

            for (let i = 0; i < filteredSignals.length; i++) {
                const normalized = (filteredSignals[i] - min) / range;
                const x = i * step;
                const y = graphCanvas.height - (normalized * (graphCanvas.height - 15) + 8);

                if (i === 0) graphCtx.moveTo(x, y);
                else graphCtx.lineTo(x, y);
            }
            graphCtx.stroke();
        }

        function clearGraph() {
            graphCtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
        }

        function updateDashboard(bpm) {
            if (bpm < 65) {
                brainDesc.innerHTML = `<strong>Zihin Durumu:</strong> Derin Dinlenme / Rölanti<br><strong>Baskın Dalga:</strong> Teta / Alfa (4-10 Hz)`;
                musicDesc.innerHTML = `<strong>Öneri:</strong> Ambient, Lo-Fi, 432 Hz Solfeggio Sesleri`;
            } else if (bpm >= 65 && bpm < 90) {
                brainDesc.innerHTML = `<strong>Zihin Durumu:</strong> Aktif Odak / Normal Ritim<br><strong>Baskın Dalga:</strong> Beta (12-22 Hz)`;
                musicDesc.innerHTML = `<strong>Öneri:</strong> Deep House, Enstrümantal Synth, Chillhop`;
            } else {
                brainDesc.innerHTML = `<strong>Zihin Durumu:</strong> Yüksek Uyarılma / Stres / Efor<br><strong>Baskın Dalga:</strong> Yüksek Beta / Gama (25+ Hz)`;
                musicDesc.innerHTML = `<strong>Sakinleşmek İçin:</strong> 60 BPM Barok/Klasik Müzik<br><strong>Antrenman İçin:</strong> Techno / Rock (130+ BPM)`;
            }
        }
    </script>
</body>
</html>
