<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Açık Kaynak PPG Nabız Ölçer</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: #1a1d2e;
            --text-main: #ffffff;
            --text-muted: #95a5a6;
            --accent-red: #e74c3c;
            --accent-green: #2ecc71;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 { margin: 0 0 5px 0; font-size: 1.4rem; text-align: center; }
        .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; text-align: center; }

        .container {
            width: 100%;
            max-width: 380px;
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        #status {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-align: center;
            min-height: 20px;
        }

        .bpm-display {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid var(--accent-red);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.3);
            transition: transform 0.1s ease;
        }

        #bpmValue {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .bpm-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        #waveCanvas {
            width: 100%;
            height: 100px;
            background-color: #0b0c10;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        button {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        button:active { opacity: 0.8; }
        #videoElement, #hiddenCanvas { display: none; }
    </style>
</head>
<body>

    <h2>Açık Kaynak PPG Monitör</h2>
    <div class="subtitle">Optik Kan Akışı ve Tepe Tespiti Algoritması</div>

    <div class="container">
        <div id="status">Ölçümü başlatmak için butona dokunun</div>
        
        <div class="bpm-display" id="bpmCircle">
            <span id="bpmValue">--</span>
            <span class="bpm-label">BPM</span>
        </div>

        <canvas id="waveCanvas" width="340" height="100"></canvas>

        <button id="actionBtn">Ölçümü Başlat</button>
    </div>

    <video id="videoElement" autoplay playsinline></video>
    <canvas id="hiddenCanvas" width="64" height="64"></canvas>

    <script>
        const video = document.getElementById('videoElement');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });
        
        const waveCanvas = document.getElementById('waveCanvas');
        const waveCtx = waveCanvas.getContext('2d');

        const bpmValue = document.getElementById('bpmValue');
        const bpmCircle = document.getElementById('bpmCircle');
        const statusText = document.getElementById('status');
        const actionBtn = document.getElementById('actionBtn');

        let isRunning = false;
        let animationFrameId;

        // Sinyal İşleme Dizileri
        const rawBuffer = [];
        const filteredBuffer = [];
        const peakIndices = [];
        const MAX_POINTS = 120;

        let lastBeatTimestamp = performance.now();
        let intervals = [];

        async function initCamera() {
            try {
                const constraints = {
                    video: {
                        facingMode: "environment",
                        width: { ideal: 64 },
                        height: { ideal: 64 }
                    }
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;

                // Flaş Desteği (Torch)
                const track = stream.getVideoTracks()[0];
                const capabilities = track.getCapabilities();
                if (capabilities.torch) {
                    await track.applyConstraints({ advanced: [{ torch: true }] });
                }
            } catch (err) {
                throw new Error("Kamera izni alınamadı veya flaş desteklenmiyor.");
            }
        }

        actionBtn.addEventListener('click', async () => {
            if (isRunning) {
                stopMeasurement();
            } else {
                try {
                    statusText.innerText = "Kamera ve flaş açılıyor...";
                    await initCamera();
                    video.onloadedmetadata = () => {
                        video.play();
                        isRunning = true;
                        actionBtn.innerText = "Durdur";
                        actionBtn.style.backgroundColor = "#7f8c8d";
                        statusText.innerText = "Parmağınızı kamera ve flaşın üzerine HAFİFÇE kapatın.";
                        loop();
                    };
                } catch (e) {
                    statusText.innerText = e.message;
                }
            }
        });

        function stopMeasurement() {
            isRunning = false;
            actionBtn.innerText = "Ölçümü Başlat";
            actionBtn.style.backgroundColor = "var(--accent-red)";
            statusText.innerText = "Ölçüm durduruldu.";
            bpmValue.innerText = "--";
            
            cancelAnimationFrame(animationFrameId);
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            rawBuffer.length = 0;
            filteredBuffer.length = 0;
            peakIndices.length = 0;
            intervals.length = 0;
            clearCanvas();
        }

        function loop() {
            if (!isRunning) return;

            // Kameradan kare al ve yeşil kanal ortalamasını hesapla (Green PPG)
            hiddenCtx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
            const frameData = hiddenCtx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);
            
            let greenSum = 0, redSum = 0;
            const totalPixels = frameData.data.length / 4;

            for (let i = 0; i < frameData.data.length; i += 4) {
                redSum += frameData.data[i];
                greenSum += frameData.data[i + 1];
            }

            const avgRed = redSum / totalPixels;
            const avgGreen = greenSum / totalPixels;

            // Parmak Kontrolü (Kırmızı ve yeşil oranına göre parmak algılama)
            if (avgRed < 100 || avgRed < avgGreen * 1.1) {
                statusText.innerText = "Parmağınızı kameraya tam ve hareketsiz yerleştirin!";
                bpmValue.innerText = "--";
            } else {
                statusText.innerText = "Sinyal alınıyor, sabit tutun...";
                processSignal(avgGreen);
                drawWaveform();
            }

            animationFrameId = requestAnimationFrame(loop);
        }

        function processSignal(value) {
            rawBuffer.push(value);
            if (rawBuffer.length > MAX_POINTS) rawBuffer.shift();
            if (rawBuffer.length < 30) return;

            // DC bileşeni (trend) temizleme - High Pass Filtre mantığı
            const mean = rawBuffer.reduce((a, b) => a + b, 0) / rawBuffer.length;
            const acComponent = value - mean;

            filteredBuffer.push(acComponent);
            if (filteredBuffer.length > MAX_POINTS) filteredBuffer.shift();

            const len = filteredBuffer.length;
            if (len < 5) return;

            // Yerel Tepe (Systolic Peak) Algılama Mantığı
            const prev2 = filteredBuffer[len - 3];
            const prev1 = filteredBuffer[len - 2];
            const curr = filteredBuffer[len - 1];

            const recentMax = Math.max(...filteredBuffer.slice(-35));
            const dynamicThreshold = recentMax * 0.55;

            const now = performance.now();
            const timeDelta = now - lastBeatTimestamp;

            // Zirve noktası ve mantıklı nabız aralığı (40 - 180 BPM arası)
            if (prev1 > prev2 && prev1 > curr && prev1 > dynamicThreshold) {
                if (timeDelta > 330 && timeDelta < 1500) {
                    lastBeatTimestamp = now;
                    const instantBpm = 60000 / timeDelta;

                    intervals.push(instantBpm);
                    if (intervals.length > 5) intervals.shift();

                    peakIndices.push(len - 2);
                    if (peakIndices.length > 8) peakIndices.shift();

                    // Vuruş animasyonu
                    bpmCircle.style.transform = "scale(1.1)";
                    setTimeout(() => bpmCircle.style.transform = "scale(1)", 100);

                    // Kararlı sonuç için ortalama alma
                    const sortedIntervals = [...intervals].sort((a, b) => a - b);
                    const medianBpm = Math.round(sortedIntervals[Math.floor(sortedIntervals.length / 2)]);
                    
                    bpmValue.innerText = medianBpm;
                }
            }
        }

        function drawWaveform() {
            waveCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
            if (filteredBuffer.length < 2) return;

            const min = Math.min(...filteredBuffer);
            const max = Math.max(...filteredBuffer);
            const span = (max - min) || 1;

            waveCtx.beginPath();
            waveCtx.lineWidth = 2;
            waveCtx.strokeStyle = "#2ecc71";

            const stepX = waveCanvas.width / (MAX_POINTS - 1);

            for (let i = 0; i < filteredBuffer.length; i++) {
                const normalizedVal = (filteredBuffer[i] - min) / span;
                const x = i * stepX;
                const y = waveCanvas.height - (normalizedVal * (waveCanvas.height - 20) + 10);

                if (i === 0) waveCtx.moveTo(x, y);
                else waveCtx.lineTo(x, y);
            }
            waveCtx.stroke();

            // Tepe noktalarını işaretle
            peakIndices.forEach(idx => {
                if (idx < filteredBuffer.length) {
                    const norm = (filteredBuffer[idx] - min) / span;
                    const x = idx * stepX;
                    const y = waveCanvas.height - (norm * (waveCanvas.height - 20) + 10);

                    waveCtx.beginPath();
                    waveCtx.arc(x, y, 4, 0, Math.PI * 2);
                    waveCtx.fillStyle = "#e74c3c";
                    waveCtx.fill();
                }
            });
        }

        function clearCanvas() {
            waveCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
        }
    </script>
</body>
</html>
